<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firecracker Lambda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .status {
      font-size: 12px;
      color: #10b981;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .tab-btn:hover {
      color: #cbd5e1;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 16px;
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 500;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 12px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'Monaco', monospace;
    }

    button {
      background: #3b82f6;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .btn-danger {
      background: #ef4444;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: #64748b;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-full {
      flex: 1;
    }

    .functions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .function-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .function-info {
      flex: 1;
      min-width: 0;
    }

    .function-name {
      font-weight: 600;
      font-size: 13px;
      color: #3b82f6;
      margin-bottom: 2px;
    }

    .function-id {
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
    }

    .function-actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .function-actions button {
      padding: 6px 10px;
      font-size: 11px;
    }

    .output {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      font-family: 'Monaco', monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .output.success {
      border-left: 3px solid #10b981;
      color: #86efac;
    }

    .output.error {
      border-left: 3px solid #ef4444;
      color: #fca5a5;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .metric-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 2px;
    }

    .metric-label {
      font-size: 11px;
      color: #94a3b8;
    }

    .env-var-item {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .env-var-item input {
      flex: 1;
      min-width: 0;
    }

    .env-var-item input:first-child {
      max-width: 40%;
    }

    .env-var-item button {
      padding: 6px 10px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 13px;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .function-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .function-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>⚡ Firecracker Lambda</h1>
    </div>
    <div class="status" id="serverStatus">● Connecting...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('functions')">📦 Functions</button>
    <button class="tab-btn" onclick="switchTab('deploy')">➕ Deploy</button>
    <button class="tab-btn" onclick="switchTab('invoke')">⚡ Invoke</button>
    <button class="tab-btn" onclick="switchTab('metrics')">📊 Metrics</button>
  </div>

  <div class="container">
    <!-- Functions Tab -->
    <div id="functions" class="tab-content active">
      <div class="card">
        <h2>Deployed Functions</h2>
        <div id="functionsList" class="functions-list">
          <div class="empty-state">Loading functions...</div>
        </div>
        <div style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 12px;">
          <button type="button" onclick="loadFunctions()" class="btn-secondary">🔄 Refresh</button>
        </div>
      </div>
    </div>

    <!-- Deploy Tab -->
    <div id="deploy" class="tab-content">
      <div class="card">
        <h2>Deploy Function</h2>
        <form id="deployForm">
          <div class="form-group">
            <label>Function Name *</label>
            <input type="text" id="functionName" placeholder="my-function" required>
          </div>

          <div class="form-group">
            <label>Code (TypeScript) *</label>
            <textarea id="functionCode" placeholder="export default defineHandler(async (payload) => {&#10;  return { result: 'Hello' };&#10;});" required></textarea>
          </div>

          <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #334155;">
            <label style="margin-bottom: 8px;">Environment Variables</label>
            <div id="envVarsList"></div>
            <button type="button" id="addEnvVarBtn" class="btn-secondary" style="width: 100%; margin-top: 8px;">+ Add Variable</button>
          </div>

          <button type="submit" class="btn-full" style="margin-top: 16px; width: 100%;">Deploy</button>
          <div id="deployResult"></div>
        </form>
      </div>
    </div>

    <!-- Invoke Tab -->
    <div id="invoke" class="tab-content">
      <div class="grid">
        <div class="card">
          <h2>Select & Invoke</h2>
          <form id="invokeForm">
            <div class="form-group">
              <label>Function *</label>
              <select id="functionSelect" required>
                <option value="">Select a function...</option>
              </select>
            </div>

            <div class="form-group">
              <label>Payload (JSON)</label>
              <textarea id="invokePayload" placeholder='Select a function first...'>{}</textarea>
            </div>

            <button type="submit" style="width: 100%;">Invoke Function</button>
          </form>
        </div>

        <div class="card">
          <h2>Response</h2>
          <div id="invokeResult" class="output" style="margin-top: 0; min-height: 150px;">
            <p style="color: #94a3b8;">Response will appear here...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Metrics Tab -->
    <div id="metrics" class="tab-content">
      <div class="grid">
        <div class="card">
          <h2>Get Metrics</h2>
          <form id="metricsForm">
            <div class="form-group">
              <label>Function *</label>
              <select id="metricsFunction" required>
                <option value="">Select a function...</option>
              </select>
            </div>
            <button type="button" id="getMetricsBtn" style="width: 100%;">Get Stats</button>
          </form>
        </div>

        <div class="card">
          <h2>Performance Stats</h2>
          <div id="metricsResult"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let envVarId = 0;

    // Tab switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    // Environment variables management

    document.getElementById('addEnvVarBtn').addEventListener('click', () => {
      const id = envVarId++;
      const container = document.getElementById('envVarsList');
      const item = document.createElement('div');
      item.className = 'env-var-item';
      item.id = `env-var-${id}`;
      item.innerHTML = `
        <input type="text" placeholder="Variable name" class="env-name" value="">
        <input type="text" placeholder="Value" class="env-value" value="">
        <button type="button" onclick="removeEnvVar(${id})">Remove</button>
      `;
      container.appendChild(item);
    });

    function removeEnvVar(id) {
      document.getElementById(`env-var-${id}`).remove();
    }

    function collectEnvVars() {
      const envVars = {};
      document.querySelectorAll('.env-var-item').forEach(item => {
        const name = item.querySelector('.env-name').value;
        const value = item.querySelector('.env-value').value;
        if (name && value) {
          envVars[name] = value;
        }
      });
      return envVars;
    }

    // Deploy function
    document.getElementById('deployForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('functionName').value;
      const code = document.getElementById('functionCode').value;
      const env = collectEnvVars();

      try {
        const response = await fetch(`${API_BASE}/functions/deploy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, code, env })
        });

        const result = await response.json();
        const resultDiv = document.getElementById('deployResult');

        if (response.ok) {
          resultDiv.className = 'output success';
          resultDiv.textContent = `✓ Deployed: ${result.functionId}`;
          document.getElementById('deployForm').reset();
          document.getElementById('envVarsList').innerHTML = '';
          envVarId = 0;
          await loadFunctions();
          setTimeout(() => switchTab('functions'), 1000);
        } else {
          resultDiv.className = 'output error';
          resultDiv.textContent = `✗ ${result.error || 'Deploy failed'}`;
        }
      } catch (error) {
        document.getElementById('deployResult').className = 'output error';
        document.getElementById('deployResult').textContent = `✗ ${error.message}`;
      }
    });

    // Invoke function
    document.getElementById('functionSelect').addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) {
        // Auto-populate with a basic payload
        document.getElementById('invokePayload').value = JSON.stringify({}, null, 2);
      }
    });

    document.getElementById('invokeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('functionSelect').value;
      let payload;
      try {
        payload = JSON.parse(document.getElementById('invokePayload').value);
      } catch {
        alert('Invalid JSON payload');
        return;
      }

      const resultDiv = document.getElementById('invokeResult');
      resultDiv.textContent = '⏳ Invoking...';

      try {
        const response = await fetch(`${API_BASE}/invoke/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload })
        });

        const result = await response.json();
        resultDiv.className = response.ok ? 'output success' : 'output error';
        resultDiv.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        resultDiv.className = 'output error';
        resultDiv.textContent = `✗ ${error.message}`;
      }
    });

    // Get metrics
    document.getElementById('getMetricsBtn').addEventListener('click', async () => {
      const functionId = document.getElementById('metricsFunction').value;
      if (!functionId) {
        alert('Select a function');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/metrics/functions/${functionId}/stats`);
        const result = await response.json();
        const resultDiv = document.getElementById('metricsResult');

        if (response.ok) {
          const stats = result.stats;
          resultDiv.innerHTML = `
            <div class="metrics-grid">
              <div class="metric-box">
                <div class="metric-value">${stats.avgDuration.toFixed(0)}ms</div>
                <div class="metric-label">Avg Duration</div>
              </div>
              <div class="metric-box">
                <div class="metric-value">${(stats.errorRate * 100).toFixed(1)}%</div>
                <div class="metric-label">Error Rate</div>
              </div>
              <div class="metric-box">
                <div class="metric-value">${stats.minDuration}ms</div>
                <div class="metric-label">Min Duration</div>
              </div>
              <div class="metric-box">
                <div class="metric-value">${stats.maxDuration}ms</div>
                <div class="metric-label">Max Duration</div>
              </div>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="output error">${result.error}</div>`;
        }
      } catch (error) {
        document.getElementById('metricsResult').innerHTML = `<div class="output error">✗ ${error.message}</div>`;
      }
    });

    // Load functions list
    async function loadFunctions() {
      try {
        const response = await fetch(`${API_BASE}/functions`);
        const functions = await response.json();

        const list = document.getElementById('functionsList');
        const select = document.getElementById('functionSelect');
        const metricsSelect = document.getElementById('metricsFunction');

        list.innerHTML = '';
        select.innerHTML = '<option value="">Select a function...</option>';
        metricsSelect.innerHTML = '<option value="">Select a function...</option>';

        if (!functions || functions.length === 0) {
          list.innerHTML = '<div class="empty-state">No functions deployed yet. Go to Deploy tab to create one.</div>';
          document.getElementById('serverStatus').textContent = '● Ready';
          return;
        }

        functions.forEach(fn => {
          const item = document.createElement('div');
          item.className = 'function-item';
          item.innerHTML = `
            <div class="function-info">
              <div class="function-name">${fn.name}</div>
              <div class="function-id">${fn.id}</div>
            </div>
            <div class="function-actions">
              <button type="button" class="btn-secondary" onclick="invokeFunction('${fn.name}')">Invoke</button>
              <button type="button" class="btn-danger" onclick="deleteFn('${fn.id}')">Delete</button>
            </div>
          `;
          list.appendChild(item);

          const option1 = document.createElement('option');
          option1.value = fn.name;
          option1.textContent = fn.name;
          select.appendChild(option1);

          const option2 = document.createElement('option');
          option2.value = fn.name;
          option2.textContent = fn.name;
          metricsSelect.appendChild(option2);
        });

        document.getElementById('serverStatus').textContent = `● Ready (${functions.length})`;
      } catch (error) {
        console.error('Failed to load functions:', error);
        document.getElementById('serverStatus').textContent = '● Error';
      }
    }

    function invokeFunction(name) {
      switchTab('invoke');
      document.getElementById('functionSelect').value = name;
      document.getElementById('invokePayload').focus();
    }

    async function deleteFn(id) {
      if (!confirm(`Delete function "${id}"?`)) return;

      try {
        const response = await fetch(`${API_BASE}/functions/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          await loadFunctions();
        } else {
          alert('Failed to delete function');
        }
      } catch (error) {
        alert(`Error: ${error.message}`);
      }
    }

    // Load functions on page load
    loadFunctions();
    setInterval(loadFunctions, 10000);
  </script>
</body>
</html>
